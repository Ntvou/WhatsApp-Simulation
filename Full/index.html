<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat Simulation</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 420px;
            height: 700px;
            background: #EAEAEA;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background: #075E54;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        .chat-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            background: #E5DDD5;
            display: flex;
            flex-direction: column;
        }
        .message {
            max-width: 75%;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
        }
        .sent {
            background: #DCF8C6;
            align-self: flex-end;
        }
        .received {
            background: white;
            align-self: flex-start;
        }
        .typing {
            font-style: italic;
            color: gray;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

    const END_AT_MS = 300000;

    const TYPING_MS = 1200;

    const SCHEDULE_SEED = 20251031;

    const updatedMessages = [
        { id: 1, sender: "Alex", text: "Last night was WILD! What did everyone get up to after we left the party? 😜🎃" },
        { id: 2, sender: "Alex", text: "Honestly, I feel like I missed out on something crazy..." },
        { id: 3, sender: "Alex", text: "Spill!" },
        { id: 4, sender: "Charlie", text: "Let’s just say things got a little out of hand... I heard someone’s car wasn’t where it was supposed to be. 😬" },
        { id: 5, sender: "Charlie", text: "Yeah, it was like chaos after you guys left. You won’t believe it." },
        { id: 6, sender: "Jess", text: "Wait, WHAT?! A missing car? I heard about that too!" },
        { id: 7, sender: "Charlie", text: "Lol" },
        { id: 8, sender: "Jess", text: "Are you serious, though? Someone actually moved a car??" },
        { id: 9, sender: "Jess", text: "Who even does that?!" },
        { id: 10, sender: "Sam", text: "Uh... yeah, so about that..." },
        { id: 11, sender: "Sam", text: "I, uh, may have seen someone take Jodie's red Ford for a little ride..." },
        { id: 12, sender: "Sam", text: "But I guess it’s Halloween!" },
        { id: 13, sender: "Sam", text: "People do wild stuff" },

        { id: 15, sender: "Alex", text: "Like, someone actually took a car? That’s next-level" },
        { id: 16, sender: "Sam", text: "I mean, cars get driven places, right?" },

        { id: 22, sender: "Charlie", text: "You know that row of dumpsters near the back alley?" },
        { id: 23, sender: "Charlie", text: "Yeah, it’s kind of tucked away there. Oh, and before you freak out... someone might’ve added a little Halloween flair to it 👻 Just a skeleton hanging from the rearview mirror, nothing major. Honestly, it looks pretty cool now, if I do say so myself! 🎃⚡️" },
        { id: 24, sender: "Jess", text: "WHAT?!" },

        { id: 29, sender: "Charlie", text: "Guys, calm down! It was late, it’s like an urban legend waiting to happen" },
        { id: 30, sender: "Sam", text: "Are we robbing a bank next??" },
        { id: 31, sender: "Charlie", text: "Ooh, now there’s an idea for next Halloween... jokes hehehe 🤫" }
    ];

    function createRandom(seed) {
        let state = seed >>> 0;
        return function () {
            state = (state * 1664525 + 1013904223) >>> 0;
            return state / 4294967296;
        };
    }

    function buildSchedule(count, budgetMs) {
        const gapCount = Math.max(0, count - 1);
        if (gapCount === 0) {
            return [];
        }
        const random = createRandom(SCHEDULE_SEED);
        const raw = [];
        for (let i = 0; i < gapCount; i++) {
            raw.push(GAP_MIN_MS + random() * (GAP_MAX_MS - GAP_MIN_MS));
        }
        const rawTotal = raw.reduce(function (sum, value) { return sum + value; }, 0);
        const available = budgetMs - INITIAL_DELAY_MS - TYPING_MS * count;
        if (available <= 0) {
            return raw.map(function () { return 0; });
        }
        const scale = available / rawTotal;
        return raw.map(function (value) { return value * scale; });
    }

    function WhatsAppSimulation() {
        const [messages, setMessages] = useState([]);
        const [isTyping, setIsTyping] = useState(false);
        const [phase, setPhase] = useState("initial");
        const bodyRef = useRef(null);
        const timersRef = useRef([]);

        useEffect(() => {
            const gaps = buildSchedule(initialMessages.length, SWAP_AT_MS - SETTLE_MS);
            const timers = timersRef.current;
            let index = 0;
            let active = true;

            function track(callback, delay) {
                const id = setTimeout(callback, delay);
                timers.push(id);
                return id;
            }

            function step() {
                if (!active || index >= initialMessages.length) {
                    return;
                }
                setIsTyping(true);
                track(function () {
                    if (!active) {
                        return;
                    }
                    setIsTyping(false);
                    setMessages(function (prev) {
                        return prev.concat(initialMessages[index]);
                    });
                    index += 1;
                    if (index < initialMessages.length) {
                        track(step, gaps[index - 1]);
                    }
                }, TYPING_MS);
            }

            track(step, INITIAL_DELAY_MS);

            track(function () {
                active = false;
                setIsTyping(false);
                setPhase("updated");
                setMessages(updatedMessages);
            }, SWAP_AT_MS);

            track(function () {
                active = false;
                setIsTyping(false);
                setPhase("ended");
                setMessages([{ id: 999, sender: "System", text: "Chat session has ended." }]);
                if (typeof gorilla !== "undefined") {
                    gorilla.finish();
                } else {
                    console.warn("Gorilla API is not available.");
                }
            }, END_AT_MS);

            return function () {
                active = false;
                timers.forEach(clearTimeout);
                timers.length = 0;
            };
        }, []);

        useEffect(() => {
            const body = bodyRef.current;
            if (body) {
                body.scrollTop = body.scrollHeight;
            }
        }, [messages, isTyping]);

        return (
            <div className="chat-container">
                <div className="chat-header">WhatsApp Chat</div>
                <div className="chat-body" ref={bodyRef}>
                    {messages.map(msg => (
                        msg && msg.text ? (
                            <div key={`${phase}-${msg.id}`} className={`message ${msg.sender === "You" ? "sent" : "received"}`}>
                                <strong>{msg.sender}:</strong> {msg.text}
                            </div>
                        ) : null
                    ))}
                    {isTyping && <div className="message typing">...typing</div>}
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<WhatsAppSimulation />);
</script>
</body>
</html>
